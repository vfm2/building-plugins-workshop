<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portable plugin workshop</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem; background: #eef2ff; color: #172554; font: 1rem/1.5 system-ui, sans-serif; }
    main { width: 100%; max-width: 32rem; padding: 1.5rem; border-radius: 1rem; background: white; }
    h1 { line-height: 1.2; }
    input, button { width: 100%; padding: .75rem; border-radius: .375rem; font: inherit; }
    input { border: 1px solid #172554; margin: .5rem 0 1rem; }
    button { border: 0; background: #1e3a8a; color: white; cursor: pointer; }
    :focus-visible { outline: 3px solid #1e3a8a; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Build once. Bring it everywhere.</h1>
    <p>A 15-minute introduction to portable agent plugins.</p>
    <h2>Get the workshop notes</h2>
    <form>
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
      <button type="submit">Send me the notes</button>
    </form>
    <p role="status" id="confirmation"></p>
    <p>Local demo only. No email is sent or stored.</p>
  </main>
  <script>
    document.querySelector('form').addEventListener('submit', (event) => {
      event.preventDefault();
      document.querySelector('#confirmation').textContent = 'Thanks! This is a local demo; no email was sent.';
    });
  </script>
</body>
</html>
